[package]
edition = "2024"
name = "bevy_open_vat"
version = "0.18.0"
build = false
exclude = [
    "assets/models/*",
    "assets/image.png",
    "examples/*",
    "Cargo.lock",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "OpenVAT (Vertex Animation Texture) plugin for Bevy"
readme = "README.md"
keywords = [
    "bevy",
    "gamedev",
    "animation",
    "vat",
    "gpu",
]
categories = [
    "game-development",
    "rendering",
    "graphics",
]
license = "MIT OR Apache-2.0"
